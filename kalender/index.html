<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Anmäl kalenderhändelse</title><style>body{font:17px/1.6 system-ui;background:#eef3f8;color:#17324d;margin:0;padding:24px}main{max-width:680px;margin:auto;background:white;padding:30px;border-radius:16px}label{display:block;margin:15px 0}input,textarea,button{box-sizing:border-box;font:inherit;width:100%;padding:10px;border:1px solid #a8bacb;border-radius:7px}button{background:#164e84;color:white;cursor:pointer}small{color:#536a80}</style></head><body><main><h1>Anmäl kalenderhändelse</h1><p id="association">Kontrollerar din länk…</p><p><small>Händelsen sparas som utkast och publiceras efter granskning. Länken är personlig och tidsbegränsad.</small></p>
<form id="form" hidden><label>Rubrik<input name="rubrik" required maxlength="200"></label><label>Datum<input type="date" name="datum" required></label><label>Tid<input type="time" name="tid"></label><label>Ort<input name="ort" maxlength="200"></label><label>Adress<input name="adress" maxlength="300"></label><label>Beskrivning<textarea name="beskrivning" rows="6" maxlength="10000"></textarea></label><button>Skicka för granskning</button></form><p id="status" role="status"></p></main><script src="../secure-forms.js"></script><script>
(async()=>{const grant=await VsiSecure.load('kalender');document.getElementById('association').textContent=grant.forening;const form=document.getElementById('form');form.hidden=false;form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;try{await VsiSecure.submit(Object.fromEntries(new FormData(form)));form.hidden=true;document.getElementById('status').textContent='Tack! Händelsen väntar på granskning.';}catch(error){document.getElementById('status').textContent=error.message;button.disabled=false;}});})().catch(error=>{document.getElementById('status').textContent=error.message;});
</script></body></html>
