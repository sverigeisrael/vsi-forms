<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>Kongressanmälan</title><body style="font:18px/1.6 system-ui;padding:32px;max-width:650px;margin:auto"><h1>Gemensam kongressanmälan</h1><p id="info">Alla deltagare använder nu samma formulär och anger roll där. Be administrationen om en ny personlig länk om du har en äldre länk.</p><script>const token=new URLSearchParams(location.hash.slice(1)).get('t');history.replaceState(null,'',location.pathname);if(/^[a-f0-9]{64}$/.test(token||''))location.replace('../kongress/#t='+token);</script></body></html>
